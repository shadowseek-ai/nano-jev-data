name: 数据集门禁

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-gate:
    name: 结构 / 配额 / 对抗子集
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: 主分片结构校验（schema / 标签域 / 语言纯度 / 跨 split 交叉）
        run: python scripts/topup_verify.py
      - name: 配额（每垂类每语言记录数）
        run: python scripts/check_quota.py
      - name: 派生与对抗子集验收
        run: python scripts/audit_derived.py
      - name: MANIFEST 与文件哈希一致
        run: python scripts/freeze_manifest.py --dry-run
      - name: README 统计表与数据一致
        run: |
          python scripts/update_readme_stats.py
          if ! git diff --quiet -- README.md; then
            echo "::error::README 统计表与实际数据不一致，请本地运行 scripts/update_readme_stats.py 后提交"
            git diff --stat -- README.md
            exit 1
          fi

  secret-scan:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫描全历史对象
        run: python scripts/scan_secrets.py
